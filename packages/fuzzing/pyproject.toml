[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloud-dast-fuzzing"
version = "0.1.0"
description = "Adaptive fuzzing extension for Cloud DAST"
requires-python = "~=3.12.0"
dependencies = [
    "cloud-dast-core==0.1.0",
    "hypothesis>=6.170.5",
    "hypothesis-jsonschema>=0.23.1",
]

[project.entry-points."cloud_dast.extensions"]
fuzzing = "cloud_dast_fuzzing.plugin:register"

[tool.hatch.build.targets.wheel]
packages = ["src/cloud_dast_fuzzing"]

[tool.uv.sources]
cloud-dast-core = { path = "../core" }
