[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloud-dast-core"
version = "0.1.0"
description = "Cloud DAST engine core"
requires-python = "~=3.12.0"
dependencies = [
    "clingo>=5.8",
    "cryptography>=41.0.7",
    "dishka>=1.10.1",
    "grpcio>=1.60",
    "hypothesis>=6.170.5",
    "hypothesis-jsonschema>=0.23.1",
    "httpx>=0.28.1",
    "langchain-core>=1.3.11",
    "langchain-openai>=1.3.3",
    "lark>=1.2.2",
    "networkx>=3.5",
    "protobuf>=5.26",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.1",
    "river==0.22.0",
    "z3-solver>=4.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cloud_dast"]
