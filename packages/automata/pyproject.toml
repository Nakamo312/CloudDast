[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloud-dast-automata"
version = "0.1.0"
description = "Automata-learning extensions for Cloud DAST"
requires-python = "~=3.12.0"
dependencies = [
    "aalpy>=1.5.1",
    "cloud-dast-core==0.1.0",
]

[project.entry-points."cloud_dast.extensions"]
automata = "cloud_dast_automata.plugin:register"

[tool.hatch.build.targets.wheel]
packages = ["src/cloud_dast_automata"]

[tool.uv.sources]
cloud-dast-core = { path = "../core" }
