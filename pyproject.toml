[project]
name = "cloud-dast"
version = "0.1.0"
description = "Application-agnostic DAST engine over a formal QDL substrate"
requires-python = "~=3.12.0"
dependencies = [
    "clingo>=5.8",
    "cryptography>=41.0.7",
    "dishka>=1.10.1",
    "grpcio>=1.60",
    "hypothesis>=6.170.5",
    "hypothesis-jsonschema>=0.23.1",
    "httpx>=0.28.1",
    "langchain-core>=1.3.11",
    "langchain-openai>=1.3.3",
    "lark>=1.2.2",
    "networkx>=3.5",
    "protobuf>=5.26",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.1",
    "river==0.22.0",
    "z3-solver>=4.13",
]

[project.optional-dependencies]
neo4j = [
    "neo4j>=5.28.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [
    "packages/core/src",
    "packages/fuzzing/src",
    "packages/automata/src",
    "packages/symbolic/src",
    "packages/llm/src",
    "packages/reporting/src",
]

[tool.importlinter]
root_packages = ["cloud_dast"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.ruff]
line-length = 88
target-version = "py312"
src = [
    "packages/core/src",
    "packages/fuzzing/src",
    "packages/automata/src",
    "packages/symbolic/src",
    "packages/llm/src",
    "packages/reporting/src",
    "benchmarks",
    "tests",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E402"]

[tool.ruff.lint.isort]
known-first-party = [
    "cloud_dast",
    "cloud_dast_automata",
    "cloud_dast_fuzzing",
    "cloud_dast_llm",
    "cloud_dast_symbolic",
    "cloud_dast_reporting",
    "tests",
]

[tool.structure-lint]
function-max-lines = 100
signature-max-parameters = 8
module-max-imports = 40
cyclomatic-max = 15
name-max-length = 48
name-max-words = 5
